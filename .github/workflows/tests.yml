name: Tests

# Regression gate: runs the PHPUnit suite and PHPStan on every push and PR. Does not deploy.
on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHPUnit + PHPStan
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      # Real env var overrides the DDEV DSN from .env (Symfony Dotenv does not override
      # real environment variables). Points to the CI database service on 127.0.0.1.
      # Base db name is "app"; in the test environment Doctrine appends the "_test" suffix
      # (config/packages/doctrine.yaml when@test), so the effective db is "app_test" — which
      # is the database the service below creates.
      #
      # MariaDB 10.11 and not MySQL, because that is what production runs (cdmon). The two
      # are NOT interchangeable in DDL: `ALTER TABLE ... ADD period VARCHAR(8)` is valid
      # MySQL and a syntax error on MariaDB, which has `ADD PERIOD FOR`. That exact line
      # stopped a deploy dead on 31/07 with 18 migrations applied and 4 to go, and the step
      # below — which exists to prove the migrations are executable — had passed it green.
      DATABASE_URL: 'mysql://root:root@127.0.0.1:3306/app?serverVersion=mariadb-10.11.15&charset=utf8mb4'

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # gd porque el acta en PDF lleva el logo del centro en el membrete: sin gd, Dompdf no procesa
          # la imagen y pinta su recuadro de "imagen rota" en vez de fallar. El PHP de producción (cdmon)
          # lo trae compilado dentro, así que aquí se pide para que CI pruebe el mismo camino.
          extensions: mbstring, intl, pdo_mysql, gd
          coverage: none

      - name: Cache vendor/
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-php83-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --optimize-autoloader

      # Run migrations (not schema:create) so CI also verifies the migrations are executable
      # and the resulting schema matches the entity metadata.
      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: php bin/phpunit --testdox
