security:
    # Passwordless system: users authenticate with Google/Educamadrid SSO or with a magic link sent
    # by e-mail. No password hashers are configured on purpose.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        family_provider:
            entity:
                class: App\Entity\FamilyVolunteer
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # The families who volunteer in the centre's activities. A firewall of their own, with a provider
        # that loads only FamilyVolunteer, so a family can never hold a session in `main`: the staff area
        # is closed to them by type, not by each screen checking. Same passwordless e-mail link as staff.
        families:
            pattern: ^/familias
            lazy: true
            provider: family_provider
            entry_point: app.security.family_entry_point
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            login_link:
                check_route: family_login_check
                check_post_only: true
                # Its own key: the signature covers neither the account class nor the firewall, so with
                # the shared one a staff link would also open this area for an account with the same
                # e-mail and id.
                secret: '%kernel.secret%:families'
                # Without these a spent or expired link would land on the STAFF login (the defaults are /login).
                login_path: family_login
                failure_path: family_login
                signature_properties: ['id']
                lifetime: 600
                max_uses: 1
                default_target_path: family_home
            remember_me:
                secret: '%kernel.secret%'
                name: '%app.family_remember_me_cookie%'
                path: /familias
                lifetime: 2592000
                signature_properties: ['id']
                secure: auto
                samesite: lax
            logout:
                path: family_logout
                target: family_login
                # The session is shared with `main`: a teacher who also volunteers stays signed in there.
                invalidate_session: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            entry_point: App\Security\LoginEntryPoint
            custom_authenticators:
                # The magic-link authenticator is registered automatically via the login_link key below.
                - App\Security\GoogleAuthenticator
            login_throttling:
                max_attempts: 5 # per IP + identifier, before the login check is throttled
                interval: '15 minutes'
            login_link:
                check_route: login_check
                # Opening the link only shows an "Entrar" button; pressing it (a POST) spends the link.
                # Mail scanners and phones that open a link twice in a row spend it just by visiting
                # it, and the person then lands on "invalid or expired".
                check_post_only: true
                signature_properties: ['id']
                lifetime: 600 # the link is valid for 10 minutes
                max_uses: 1 # single-use: the link is invalidated after the first successful use
            # "Recordarme en este dispositivo": opt-in from the login page, so a shared staff-room
            # computer keeps the short idle timeout while a personal phone stays signed in. Every
            # re-entry through the cookie is a new authentication, so the UserChecker (deactivated
            # account, sign-in closed) applies to it just as to any other sign-in.
            remember_me:
                secret: '%kernel.secret%'
                name: '%app.remember_me_cookie%'
                lifetime: 2592000 # 30 days
                signature_properties: ['id']
                secure: auto
                samesite: lax
            logout:
                path: app_logout
                target: login

    # Only the first matching rule applies.
    access_control:
        # Before the catch-all ^/: the families' area has its own role, which staff do not hold either.
        - { path: ^/familias/entrar, roles: PUBLIC_ACCESS }
        - { path: ^/familias, roles: ROLE_FAMILY }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/connect, roles: PUBLIC_ACCESS }
        # La información de protección de datos tiene que poder leerse ANTES de entrar (enlace en el
        # login). Solo la copia pública: la pantalla de lectura y el «Entendido» son de quien ya entró.
        - { path: ^/proteccion-datos$, roles: PUBLIC_ACCESS }
        # Machine-to-machine cron endpoints are authenticated by a shared secret token in the
        # controller (not a session), so the firewall must let them through unauthenticated. Each is
        # pinned to its exact path so a broad ^/cron prefix never opens a future route by accident.
        - { path: ^/cron/task-reminders$, roles: PUBLIC_ACCESS }
        - { path: ^/cron/event-reminders$, roles: PUBLIC_ACCESS }
        # El tick del planificador: un endpoint que solo dice "es la hora" y decide la aplicación qué
        # toca. Token en cabecera (X-Cron-Token) y no en la query, para que no quede escrito en los
        # logs de acceso, y sin token configurado responde 404 — fail-closed por omisión.
        - { path: ^/cron/tick$, roles: PUBLIC_ACCESS }
        # El chequeo de salud va SIN token, a propósito: no ejecuta nada, no recibe parámetros y no
        # expone datos personales (solo nombres de tareas internas y si van con retraso). Pedir token
        # obligaría a configurarlo en el monitor externo, y un chequeo que cuesta configurar acaba sin
        # configurarse — que es la avería que todo esto viene a cerrar.
        - { path: ^/cron/health$, roles: PUBLIC_ACCESS }
        # The activity trail is sensitive (it shows everyone's actions): admins only.
        - { path: ^/audit, roles: ROLE_ADMIN }
        # User/role/org administration: only requires a member of staff here; the fine-grained
        # gate is the AreaVoter on ADMINISTRATION in each admin controller, so a role granted write
        # access to Administration (e.g. Direction) can manage without being a superuser.
        - { path: ^/admin, roles: ROLE_STAFF }
        # Everything else is the staff area, and asks for ROLE_STAFF — not ROLE_USER, which any signed-in
        # account is assumed to carry. Families who volunteer will sign in too, and the staff area holds
        # what they must never see (the guardias report with absence reasons, meetings, minutes). Only
        # App\Entity\User grants ROLE_STAFF, so any other kind of account is kept out by default and
        # only reaches the screens a rule above opens to it explicitly.
        - { path: ^/, roles: ROLE_STAFF }
