framework:
    workflows:
        # Un ÚNICO ciclo de vida para toda tarea (simple o con entregable): el mismo vocabulario de
        # estados para todas, sin estados que existan solo para algunos tipos.
        #   Pendiente → (Entregar) → Entregada → (Validar) → Finalizada
        #                                     ↘ (Devolver) → En revisión → (Entregar) → Entregada …
        #   Pendiente → (Cancelar) → Cancelada
        #
        # "En revisión" es un sitio propio y no una vuelta a Pendiente. Es lo que pidió el centro con esas
        # palabras, y describe algo distinto: una tarea Pendiente es la que nadie ha tocado, y una En
        # revisión ya se entregó una vez y lleva por escrito qué hay que corregir. Con las dos en el mismo
        # sitio ni el listado ni el aviso podían distinguirlas, y quien la tenía leía "Pendiente" como si
        # su trabajo no hubiera existido. El ciclo no tiene tope de vueltas a propósito: "puede haber tanta
        # retroalimentación como sea necesaria".
        #
        # La única diferencia entre tipos NO es un estado: es QUÉ hay que aportar al entregar (enlace,
        # archivo, cualquiera de los dos o nada; ver App\Enum\DeliverableRequirement), y lo controla el
        # controlador.
        task:
            type: state_machine
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\Task
            initial_marking: pending
            places:
                - pending
                - submitted
                - in_review
                - validated
                - cancelled
            transitions:
                submit:
                    from: [pending, in_review]
                    to: submitted
                # También desde Pendiente ("Dar por finalizada"): sin esa salida, una tarea que el titular
                # no entrega —está de baja, la hizo fuera de la app— se quedaba pendiente para siempre y
                # al superior solo le quedaba Cancelar, que en el histórico miente ("anulada") y es
                # terminal. Sigue siendo cosa del superior: el guard no ha cambiado.
                validate:
                    from: [pending, submitted, in_review]
                    to: validated
                # "Devolver para revisar": exige por escrito qué hay que cambiar (lo pide el controlador).
                review:
                    from: submitted
                    to: in_review
                # Cancelar sigue saliendo de TODO lo abierto, como siempre. Lo que el centro pidió quitar
                # es cancelar una tarea FUERA DE PLAZO (para que pasarse de fecha no sea una vía de
                # escape), y eso lo comprueba TaskController contra la fecha, no la máquina de estados.
                # Restringirlo además a Pendiente quitaría una salida que hoy existe y que nadie pidió
                # tocar: una actividad que se anula en enero puede tener ya algo entregado.
                cancel:
                    from: [pending, submitted, in_review]
                    to: cancelled
