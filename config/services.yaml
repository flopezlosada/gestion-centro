# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Private, persistent storage for uploaded files (outside public/, survives deploys).
    # Built on the project's APP_SHARE_DIR convention.
    app.uploads_dir: '%kernel.project_dir%/%env(APP_SHARE_DIR)%'
    # "From" address for the reminder e-mails. Override per environment via MAILER_FROM.
    app.mailer_from: '%env(MAILER_FROM)%'
    # Mailbox of the copy room, where "pedir fotocopias" orders are sent. The real address is the
    # centre's and this repository is public, so it lives in the environment (COPY_SHOP_EMAIL), never
    # here — same reason as app.organization_name. The placeholder default also keeps a misconfigured
    # environment from mailing real orders to the centre by accident.
    app.copy_shop_email: '%env(default:app_copy_shop_email_default:COPY_SHOP_EMAIL)%'
    app_copy_shop_email_default: 'fotocopias@example.test'
    # Buzón del equipo directivo: los encargos de fotocopias salen a su nombre y las respuestas van ahí.
    # Sin definir = las respuestas van a quien pidió las copias. El default va por parámetro y no como
    # "default::", que resuelve a NULL y revienta el servicio que espera una cadena.
    app.direction_email: '%env(default:app_direction_email_default:DIRECTION_EMAIL)%'
    app_direction_email_default: ''
    # Organisation name shown across the app. Generic by default; the centre overrides it per
    # environment via APP_ORG_NAME (kept out of the repo on purpose).
    app.organization_name: '%env(default:app_organization_name_default:APP_ORG_NAME)%'
    app_organization_name_default: 'Centro educativo'
    # Acceso a RAICES para el recordatorio "apunta las ausencias del alumnado" que acompaña a cada
    # guardia. VACÍO por defecto a propósito: el aviso se da igual, pero sin enlace mientras no se
    # configure la URL real del centro (APP_RAICES_URL) — un enlace inventado en mitad de una guardia
    # es peor que ninguno.
    app.raices_url: '%env(default:app_raices_url_default:APP_RAICES_URL)%'
    app_raices_url_default: ''
    # Idle-session timeout in seconds. 0 disables it (dev/test, so development sessions don't drop);
    # production overrides it in the when@prod block below.
    app.session_idle_timeout: 0

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $uploadsDir: '%app.uploads_dir%'
            string $publicDir: '%kernel.project_dir%/public'
            string $pendingImportsDir: '%kernel.project_dir%/var/timetable-imports'
            int $sessionIdleTimeout: '%app.session_idle_timeout%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@prod:
    parameters:
        # 30 minutes of inactivity. SSO (Google/Educamadrid) makes re-login a single click, so the
        # UX cost is low while it protects sessions left open on shared staff-room computers.
        app.session_idle_timeout: 1800

when@test:
    services:
        # Functional tests drive the task state machines through the same entry point as the app.
        # TaskWorkflow has no consumer yet (a controller will inject it), so the compiler would
        # remove this unused private service. A public alias keeps it alive and reachable from the
        # test container, without redefining the autowired service (so it keeps its Registry arg).
        test.task_workflow:
            alias: App\Service\TaskWorkflow
            public: true
